services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        WGCF_VERSION: ${WGCF_VERSION:-2.2.31}
        WARP_GATEWAY_VERSION: ${IMAGE_TAG:-0.4.1}
    image: warp-egress-gateway:${IMAGE_TAG:-0.4.1}
    container_name: warp-egress-gateway
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp
    volumes:
      - ./generated/warp-gateway.env:/etc/warp-egress-gateway/warp-gateway.env:ro
      - ./state:/var/lib/warp-egress-gateway
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: warp-egress-gateway
    init: true
    stop_grace_period: 20s
