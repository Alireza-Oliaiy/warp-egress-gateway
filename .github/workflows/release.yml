name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install validation and packaging tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck docker-compose-v2 zip unzip
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          expected="v$(cat VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${expected}" >&2
            exit 1
          fi
      - name: Run release tests
        run: bash tests/run-all.sh
      - name: Build release artifacts
        run: bash scripts/package-release.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/warp-egress-gateway-$(cat VERSION).tar.gz \
            release/warp-egress-gateway-$(cat VERSION).zip \
            release/warp-egress-gateway-$(cat VERSION)-SHA256SUMS.txt \
            --title "WARP Egress Gateway ${GITHUB_REF_NAME}" \
            --generate-notes
