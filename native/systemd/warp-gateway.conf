# Drop-in for wg-quick@warp0.service
[Unit]
Requires=warp-gateway-firewall.service
After=network-pre.target warp-gateway-firewall.service

[Service]
ExecStart=
ExecStart=/usr/local/lib/warp-egress-gateway/wg-quick-locked.sh up %i
ExecStop=
ExecStop=/usr/local/lib/warp-egress-gateway/wg-quick-locked.sh down %i
ExecReload=
ExecReload=/usr/local/lib/warp-egress-gateway/wg-quick-locked.sh reload %i
